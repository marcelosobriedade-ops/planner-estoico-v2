kind = "web"
previewPath = "/"
title = "Planner Estoico"
version = "1.0.0"
id = "planner-estoico"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5173

[services.development]
run = "pnpm dev -- --host 0.0.0.0"

[services.production]
build = [ "pnpm", "build" ]
publicDir = "dist"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5173"
BASE_PATH = "/"
